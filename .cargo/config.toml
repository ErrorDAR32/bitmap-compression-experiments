# TileSim is an x86-64 game, built for every x86-64 processor of the
# last fifteen years or so, not the one it is built on: it is played on
# many machines. x86-64-v2 brings the popcount instruction the sampler
# counts bits with (docs/performance.md) -- SSE4.2 and POPCNT, on every
# Intel since Nehalem (2008) and every AMD since Bulldozer (2011).
[build]
rustflags = ["-C", "target-cpu=x86-64-v2"]
