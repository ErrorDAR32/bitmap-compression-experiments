[package]
name = "external_benchmarks"
version = "0.1.0"
edition = "2021"
description = "Tessera against existing bitmap compressors: CCITT Group 4, JBIG (jbigkit) and zstd"
publish = false
default-run = "external_benchmarks"

# Its own workspace: the external codecs never enter Tessera's build.
[workspace]

[dependencies]
tilesim = { path = ".." }
fax = "0.3.0"
zstd = "0.13"

[build-dependencies]
cc = "1"

[profile.release]
debug = true

# The searches live in src/tools/, not src/bin/, so each is named here.
[[bin]]
name = "adversarial"
path = "src/tools/adversarial.rs"
